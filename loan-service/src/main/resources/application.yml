server:
  port: 8084

spring:
  application:
    name: loan-service
  datasource:
    url: ${LOAN_DB_URL:jdbc:postgresql://localhost:5432/loan_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:cambia_este_secreto_jwt_en_produccion_minimo_32_caracteres}

usuario:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8082}
libro:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8083}
