services:
  postgres:
    image: postgres:16-alpine
    container_name: biblioteca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_password}
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biblioteca_user} -d ${POSTGRES_DB:-biblioteca}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
